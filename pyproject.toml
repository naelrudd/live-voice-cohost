[project]
name = "jarvis-finance"
version = "0.1.0"
description = "Streaming co-host + computer-use agent for finance live streams"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "numpy>=1.26",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "edge-tts>=7.0",
    "pynput>=1.7",
    "websockets>=13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
local-stt = ["faster-whisper>=1.0"]
browser = ["browser-use>=0.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
